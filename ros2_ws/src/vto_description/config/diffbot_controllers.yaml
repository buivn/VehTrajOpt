controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.34
    wheel_radius: 0.08

    # publish TF odom -> base_footprint (turn off once robot_localization owns odom, Phase 2)
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    open_loop: false

    use_stamped_vel: false   # accept geometry_msgs/Twist on cmd_vel

    # kinematic limits
    linear.x.max_velocity:  1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.5
    angular.z.max_velocity:  2.5
    angular.z.min_velocity: -2.5
    angular.z.max_acceleration: 3.0
